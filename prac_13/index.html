<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere - Shopping &amp; Order Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222222;
            padding: 30px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        .header {
            background-color: #1b365d;
            color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 24px;
            border-bottom: 4px solid #0284c7;
        }
        .header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 14px;
            color: #dbeafe;
        }
        .card {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        .input-label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #1b365d;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 11px 14px;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-add:hover {
            background-color: #0369a1;
        }
        .error-banner {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            background-color: #ffe5e5;
            color: #b30000;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: bold;
            color: #1b365d;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #f8fafc;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .task-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .task-text {
            font-size: 15px;
            color: #1b365d;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: #64748b;
        }
        .edit-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #0284c7;
            border-radius: 4px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn-edit {
            background-color: #1b365d;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save {
            background-color: #15803d;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete {
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 25px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ShopSphere - Shopping &amp; Order Task Manager</h1>
            <p>Organize wishlist alerts, flash sale checks, order tracking, and delivery reminders</p>
        </div>

        <div class="card">
            <label for="taskInput" class="input-label">New Shopping Task:</label>
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Enter a shopping reminder or order task...">
                <button type="button" class="btn-add" onclick="addTask()">Add Task</button>
            </div>
            <div id="errorBanner" class="error-banner">Please enter a task before adding.</div>
        </div>

        <div class="card">
            <div class="summary-bar">
                <span id="totalCount">Total Tasks: 3</span>
                <span id="completedCount">Completed: 0</span>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "shopsphere_tasks_v1";
        const defaultTasks = [
            { text: "Compare AI price alerts for AeroBuds Pro", completed: false },
            { text: "Track express shipment for StrideMax Runners", completed: false },
            { text: "Review cart items before midnight flash sale", completed: false }
        ];

        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        return parsed;
                    }
                }
            } catch (e) {
                console.log("LocalStorage unavailable, using default tasks.");
            }
            return defaultTasks.slice();
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                console.log("Unable to persist tasks to LocalStorage.");
            }
        }

        let tasks = loadTasks();
        let editingIndex = -1;

        function addTask() {
            const input = document.getElementById("taskInput");
            const errorBanner = document.getElementById("errorBanner");
            const text = input.value.trim();

            if (text === "") {
                errorBanner.style.display = "block";
                return;
            }

            errorBanner.style.display = "none";
            tasks.push({ text: text, completed: false });
            input.value = "";
            saveTasks();
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function startEdit(index) {
            editingIndex = index;
            renderTasks();
        }

        function saveEdit(index) {
            const editField = document.getElementById("editInput");
            const updatedText = editField.value.trim();
            if (updatedText !== "") {
                tasks[index].text = updatedText;
                saveTasks();
            }
            editingIndex = -1;
            renderTasks();
        }

        function deleteTask(index) {
            if (editingIndex === index) {
                editingIndex = -1;
            } else if (editingIndex > index) {
                editingIndex--;
            }
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById("taskList");
            const totalCount = document.getElementById("totalCount");
            const completedCount = document.getElementById("completedCount");

            taskList.innerHTML = "";

            const doneTotal = tasks.filter(function (item) {
                return item.completed;
            }).length;

            totalCount.textContent = "Total Tasks: " + tasks.length;
            completedCount.textContent = "Completed: " + doneTotal;

            if (tasks.length === 0) {
                const emptyMsg = document.createElement("li");
                emptyMsg.className = "empty-state";
                emptyMsg.textContent = "No shopping tasks scheduled. Add one above to get started.";
                taskList.appendChild(emptyMsg);
                return;
            }

            tasks.forEach(function (task, index) {
                const li = document.createElement("li");
                li.className = "task-item";

                const leftDiv = document.createElement("div");
                leftDiv.className = "task-left";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.addEventListener("change", function () {
                    toggleTask(index);
                });
                leftDiv.appendChild(checkbox);

                if (editingIndex === index) {
                    const editInput = document.createElement("input");
                    editInput.type = "text";
                    editInput.id = "editInput";
                    editInput.className = "edit-input";
                    editInput.value = task.text;
                    leftDiv.appendChild(editInput);
                } else {
                    const span = document.createElement("span");
                    span.className = task.completed ? "task-text completed" : "task-text";
                    span.textContent = task.text;
                    leftDiv.appendChild(span);
                }

                const actionsDiv = document.createElement("div");
                actionsDiv.className = "actions";

                if (editingIndex === index) {
                    const saveBtn = document.createElement("button");
                    saveBtn.type = "button";
                    saveBtn.className = "btn-save";
                    saveBtn.textContent = "Save";
                    saveBtn.addEventListener("click", function () {
                        saveEdit(index);
                    });
                    actionsDiv.appendChild(saveBtn);
                } else {
                    const editBtn = document.createElement("button");
                    editBtn.type = "button";
                    editBtn.className = "btn-edit";
                    editBtn.textContent = "Edit";
                    editBtn.addEventListener("click", function () {
                        startEdit(index);
                    });
                    actionsDiv.appendChild(editBtn);
                }

                const deleteBtn = document.createElement("button");
                deleteBtn.type = "button";
                deleteBtn.className = "btn-delete";
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", function () {
                    deleteTask(index);
                });
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(leftDiv);
                li.appendChild(actionsDiv);
                taskList.appendChild(li);
            });
        }

        renderTasks();
    </script>
</body>
</html>
